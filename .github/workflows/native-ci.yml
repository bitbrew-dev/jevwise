name: native CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - name: Offline release fixtures
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s scripts -p test_release_assets.py
      - name: Native build and credential-free smoke
        shell: pwsh
        run: |
          $binary = if ($IsWindows) { './jevwise-ci.exe' } else { './jevwise-ci' }
          go build -o $binary ./cmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($arguments in @(@('--help'), @('--version'), @('version'), @('skill', '--online'))) {
            & $binary @arguments
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Windows ARM64 cross-build (not executed)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: |
          go build -o jevwise-windows-arm64.exe ./cmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
