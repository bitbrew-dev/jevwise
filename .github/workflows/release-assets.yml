name: release assets
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable vX.Y.Z release (blank selects latest)
        type: string
        required: false
permissions:
  contents: write
concurrency:
  group: release-assets
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'bitbrew-dev/jevwise' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          path: tooling
          fetch-depth: 0
          persist-credentials: false
      - name: Validate existing release and immutable source
        id: plan
        working-directory: tooling
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: python3 scripts/release_assets.py plan > "$GITHUB_WORKSPACE/plan.json"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ steps.plan.outputs.commit }}
          path: source
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: source/go.mod
          cache: false
      - name: Build all six binaries without publishing credentials
        run: python3 tooling/scripts/release_assets.py build
      - name: Publish binaries and checksum completion marker last
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tooling/scripts/release_assets.py publish
