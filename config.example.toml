# Optional CLI configuration. Prefer an environment variable for credentials.
# Copy to ~/.config/jevwise/jevwise.toml, or select with --config.
[general]
provider = "jev"
# Structured debug logs on stderr; --debug or --verbose overrides.
debug = false
editor = "vim"

# Local MCP server: literal loopback IP (no scheme) and port.
[mcp]
host = "127.0.0.1"
port = 8080

[provider.jev]
api_key = "$JEV_API_KEY"
base_url = "https://api.typesafe.ai"
model = "jev-latest"
timeout = "10s"

# Google Gemini Decisions: select with provider = "gemini" or --provider gemini.
[provider.gemini]
api_key = "$GEMINI_API_KEY"
model = "gemini-decision-1"
